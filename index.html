<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="cssReset.css" />
    <link rel="stylesheet" href="blogPreviewCard.css" />

    <title>Frontend Mentor | Blog preview card</title>
  </head>
  <body>
    <div class="preview-card__container">
      <div class="preview-card center">
        <div class="card-content flex-container__column">
          <div class="image-container">
            <img
              alt="An abstract picture of black and yellow shapes."
              src="/assets/images/illustration-article.svg"
            />
          </div>
          <div class="topics-container">
            <div class="topic">
              <p class="font-heavy">Learning</p>
            </div>
          </div>
          <div class="publication-date">
            <p class="font-heavy">Published 21 Dec 2023</p>
          </div>
          <div class="text-content flex-container__column">
            <div class="heading">
              <h3 class="font-heavy">HTML & CSS foundations</h3>
            </div>
            <div class="summary">
              <p class="font-normal">
                These languages are the backbone of every website, defining
                structure, content, and presentation.
              </p>
            </div>
          </div>
          <footer>
            <div class="avatar-image">
              <img
                alt="A round profile picture of Greg Hopper."
                src="/assets/images/image-avatar.webp"
              />
            </div>
            <div class="author"><p class="font-heavy">Greg Hooper</p></div>
          </footer>
        </div>
      </div>
    </div>
  </body>
</html>
