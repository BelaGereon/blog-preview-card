<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />

    <title>Frontend Mentor | Blog preview card</title>
  </head>
  <body>
    <div class="preview-card">
      <div class="card-content">
        <div class="image-container">
          <img
            alt="An abstract picture of black and yellow shapes."
            src="/assets/images/illustration-article.svg"
          />
        </div>
        <div class="topics-container">
          <div class="topic">Learning</div>
        </div>
        <div class="publication-date">Published 21 Dec 2023</div>
        <div class="text-content">
          <div class="heading">HTML & CSS foundations</div>
          <div class="summary">
            These languages are the backbone of every website, defining
            structure, content, and presentation.
          </div>
        </div>
        <footer>
          <div class="avatar-image">
            <img
              alt="A round profile picture of Greg Hopper."
              src="/assets/images/image-avatar.webp"
            />
          </div>
          <div class="author">Greg Hooper</div>
        </footer>
      </div>
    </div>
  </body>
</html>
